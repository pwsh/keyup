name: CI

# Every job runs in a container of its own so the Postgres service is reachable by its
# service name (`postgres:5432`), and the job sees the same images a self-hosted runner would.
# The Makefile targets named in each step run the same checks on a laptop (README "Develop").
#
# The Playwright suite runs against a live archive, not fixtures (frontend/README.md "End to
# end"), so it is not part of a push: `e2e` runs only when started by hand with the URL of an
# API to read.  Signed out and without E2E_USERNAME it only reads.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e_api:
        description: "API for the Playwright suite to read (e.g. http://192.0.2.10:8096); empty skips it"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint, migration round trip, tests)
    runs-on: ubuntu-latest
    container: python:3.12-slim
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: keyup
          POSTGRES_PASSWORD: keyup
          POSTGRES_DB: keyup_test
        options: >-
          --health-cmd "pg_isready -U keyup" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://keyup:keyup@postgres:5432/keyup_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: System packages (ffmpeg for the audio tests)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
      - name: Install (the image's exact locked versions plus the test tools)
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet --require-hashes -r requirements-dev.lock
          pip install --quiet --no-deps -e .
      - name: Lint (make lint)
        run: ruff check app tests
      # Before the full suite so a broken downgrade is reported on its own line.  It builds
      # and drops a database of its own beside keyup_test.
      - name: Migration round trip (make migration-roundtrip)
        run: pytest -q tests/test_migration_roundtrip.py
      - name: Tests (make test)
        run: pytest -q -p no:cacheprovider

  frontend:
    name: frontend (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (Playwright, read-only, against a live API)
    if: github.event_name == 'workflow_dispatch' && inputs.e2e_api != ''
    runs-on: ubuntu-latest
    # Browsers and their system libraries, pinned to the @playwright/test version in package.json.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      VITE_API_TARGET: ${{ inputs.e2e_api }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # The screenshot run is a picture book, not a test; it stays a manual `npm run e2e:shots`.
      - run: npx playwright test --grep-invert screenshots
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/e2e/.results
          retention-days: 7

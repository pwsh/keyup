[project]
name = "keyup"
version = "0.1.0"
description = "Keyup — sdrtrunk call archive: ingest, transcription, REST/WebSocket API"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "Eric Holzhueter" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.1",
  "psycopg[binary]>=3",
  "alembic>=1.13",
  "pydantic>=2",
  "pydantic-settings>=2",
  "orjson>=3.10",
  "mutagen>=1.47",
  "watchdog>=4",
  "typer>=0.12",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10",
  # Alert rules run operator-written regexes against every transcript.  `regex` is the one
  # engine here that honours a match timeout, which is what bounds a catastrophic pattern.
  "regex>=2024.5.15",
  # The sdrtrunk playlist importer parses XML somebody uploaded; defusedxml refuses the
  # entity-expansion and external-entity tricks stdlib ElementTree still accepts.
  "defusedxml>=0.7.1",
  # Password hashing for the API's users (argon2id; the parameters live in the hash).
  "argon2-cffi>=23.1",
  # Tone detection (app/audioproc/tones.py) is a few FFTs per call over PCM ffmpeg already
  # decoded.  ffmpeg can filter a band but cannot answer "was one frequency carrying most
  # of the energy for a third of a second, and which one", and a pure-Python Goertzel over
  # every 32 ms frame of every call is a hundred times slower than one rfft.  This is the
  # right tool; it is a base dependency because the worker image runs the detector.
  "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/pwsh/keyup"
Source = "https://github.com/pwsh/keyup"
Issues = "https://github.com/pwsh/keyup/issues"
Changelog = "https://github.com/pwsh/keyup/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Local CPU transcription (CTranslate2).  The remote openai-compatible backend needs
# nothing beyond httpx, so the heavy wheel stays optional.
cpu = ["faster-whisper>=1.0"]
# Transcription on an Intel CPU/iGPU/NPU (OpenVINO GenAI).  Only two wheels: the runtime,
# and huggingface_hub to fetch a pre-exported IR model.  Audio is decoded to 16 kHz mono
# float32 by the ffmpeg that is already a system dependency, so there is no librosa or
# soundfile here.  optimum-intel is a *build-time* tool for exporting a model that has no
# ready-made OpenVINO repo (see app/stt/openvino_local.py) and is deliberately absent.
openvino = ["openvino-genai>=2025.2", "huggingface_hub>=0.24"]
# The RadioReference SOAP client (docs/CHANNEL_AUDIT.md).  An extra rather than a base
# dependency: RR is dormant unless the operator supplies their own Premium credentials, and
# zeep drags in a whole SOAP/XML stack.  ``app/rr/client.py`` imports it on first use, so an
# install without this extra runs everything else in the audit unchanged.
rr = ["zeep>=4.2"]
# respx mocks the OpenAI-compatible STT server in tests/stt/ without a network call.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27", "respx>=0.21"]

[project.scripts]
keyup = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Everything under app/ ships, data files included.
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests embed verbatim sdrtrunk filenames and ID3 strings (E501) and reuse fixtures by name (F811).
"tests/*" = ["E501", "F811"]
# Autogenerated migrations: column definitions are one long line each on purpose, and the
# import block is alembic's own template.
"alembic/versions/*" = ["E501", "I001"]
# The runtime-settings spec is a data table of user-facing description prose; each
# description is one intentional long string literal that renders as help text in the UI.
"app/runtime_settings.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

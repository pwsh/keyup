# Included inside nginx's `http` block (conf.d/default.conf), so the `map`
# directives below are in the right context.
#
# This file is an nginx *template*: the image copies it to /etc/nginx/templates/, and the
# stock entrypoint writes conf.d/default.conf from it at start-up, substituting the
# environment variables NGINX_ENVSUBST_FILTER lets through — only `EMBED_*` and `PUBLIC_*`,
# so nginx's own `$host`-style variables are never touched. Today that is two variables:
# EMBED_FRAME_ANCESTORS, who may put /embed/* in a frame (docs/EMBED.md), and PUBLIC_HOST,
# the one hostname search engines may index (compose sets it from VITE_PUBLIC_HOST; blank
# means none).
#
# The stack can sit behind a second, external TLS reverse proxy that talks plain
# http to this container. When it does, it already sets X-Forwarded-Proto/-Host,
# and overwriting them with this hop's own values would tell the API the visitor
# arrived over http on the container's hostname — breaking absolute links and the
# same-origin checks. So: pass an incoming value through, and only fall back to
# this hop's when there is none.
map $http_x_forwarded_proto $keyup_forwarded_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}
map $http_x_forwarded_host $keyup_forwarded_host {
    default $host;
    "~."    $http_x_forwarded_host;
}

# The WebSocket handshake needs `Connection: upgrade` — but only for a request
# that actually asked to upgrade. Sending it on every request would break
# keep-alive for the ordinary JSON calls.
map $http_upgrade $keyup_connection_upgrade {
    default upgrade;
    ""      close;
}

# Search engines may index only the public host's shell pages, and those only with no query
# string. Everything else - every call, radio and search, and every other hostname this
# build answers on - says noindex. An empty value sends no header at all. The host is an
# exact string match (no regex, so its dots are literal); the "=" prefix keeps a blank
# PUBLIC_HOST from matching anything, since $host is never empty. The page list is the
# sitemap's (frontend/src/lib/siteMeta.ts, INDEXABLE_PATHS).
map "=$host" $keyup_public_host {
    default            0;
    "=${PUBLIC_HOST}"  1;
}
map "$keyup_public_host $request_uri" $keyup_x_robots {
    default "noindex, nofollow";
    "~^1 /(?:talkgroups|stats|help)?$" "";
}

# The access log without the credentials some URLs carry (the API side is
# backend/app/log_redact.py; keep the two in step): a feed's token is its path,
# /api/feeds/<token>.rss|.atom; a feed's audio enclosure signs itself ?feed=<token>;
# an upload token rides as ?key= on /api/upload/* and the recorder socket. Three
# passes over $request_uri: the feed path, then the first and the last `feed=`,
# `key=` or `token=` in the query (lazy, then greedy), which covers a URL with two.
map $request_uri $keyup_log_uri_path {
    default $request_uri;
    "~^(?<kl_a>/api/feeds/)[^/?.]+(?<kl_b>\.(?:rss|atom)(?:\?.*)?)$" "${kl_a}REDACTED${kl_b}";
}
map $keyup_log_uri_path $keyup_log_uri_first {
    default $keyup_log_uri_path;
    "~^(?<kl_c>.*?[?&](?:feed|key|token)=)[^&]*(?<kl_d>.*)$" "${kl_c}REDACTED${kl_d}";
}
map $keyup_log_uri_first $keyup_log_uri {
    default $keyup_log_uri_first;
    "~^(?<kl_e>.*[?&](?:feed|key|token)=)[^&]*(?<kl_f>.*)$" "${kl_e}REDACTED${kl_f}";
}
# The stock `main` format with "$request" spelled out, so the masked URI stands in for
# the raw one. The Referer is left as it is: none of the URLs above is a page a browser
# navigates from. nginx's error log still quotes the raw request line on an upstream
# failure (it has no format to change); that is the one place a token can still appear.
log_format keyup_masked '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $keyup_log_uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # The stock image's path (a symlink to stdout), in the masked format above.
    access_log /var/log/nginx/access.log keyup_masked;

    # Streamed CSV/NDJSON exports and multi-hundred-megabyte audio bundles must
    # not be buffered into a 502 by nginx.
    client_max_body_size 0;

    # The list endpoints take their selections as repeated `id=` query parameters
    # — about 11 bytes each — and the API's own limit is 1000 of them. nginx's
    # default 8 kB request line would answer 414 at roughly 700, so the app's
    # honest 422 would never be reached. 32 kB clears 1000 ids with room to spare.
    large_client_header_buffers 4 32k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $keyup_forwarded_proto;
    proxy_set_header X-Forwarded-Host $keyup_forwarded_host;

    # Resolve the api service lazily through Docker's embedded DNS: nginx then
    # starts even if the API container is not up yet, and picks up its new address
    # after a restart. Variables in proxy_pass mean the URI must be appended
    # explicitly.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream http://api:8000;

    # Framing (docs/EMBED.md). Nothing but Keyup itself may put Keyup in a frame — the
    # admin pages included, which a hostile page could otherwise overlay and click-jack.
    # `/embed/*` is the one exception and sets its own policy below. nginx drops every
    # server-level `add_header` in a location that has any `add_header` of its own, so
    # the locations that serve HTML and set a header (index.html) repeat these two.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options SAMEORIGIN always;

    # The build writes a level-9 `.gz` beside every static text file (vite.config.ts,
    # `keyup-precompress`); send that as it is rather than compressing the same bytes again
    # on every request. Anything without a twin — the API's JSON, small files — still goes
    # through the on-the-fly gzip below. Gzip only: this image has no brotli module.
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml application/manifest+json
        text/csv application/x-ndjson audio/x-mpegurl;

    # The live feed. It has to come before the generic /api/ block, and it must
    # never time out on a quiet night: a channel can legitimately say nothing for
    # an hour, and the API sends its own keepalives.
    location = /api/live {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $keyup_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # The recorder push channel (WS). Same upgrade plumbing as /api/live; the API
    # sends a heartbeat every 15 s, so 300 s of read timeout is twenty missed
    # heartbeats before nginx would cut a socket the recorder thinks is fine.
    location = /api/recorder/stream {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $keyup_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Server-sent events, for clients that would rather not hold a socket open.
    location = /api/live/sse {
        proxy_pass $api_upstream$request_uri;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Range requests on the call audio have to reach the API untouched, and a
        # streamed export must not be spooled to disk first.
        proxy_buffering off;
        client_max_body_size 0;
    }

    # Vite emits content-hashed file names, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Unhashed public files: an hour, stated here because Cloudflare's zone default is 4 h.
    location ~ ^/(?:robots\.txt|sitemap\.xml|site\.webmanifest|favicon\.ico|apple-touch-icon\.png|icon-\d+\.png|og-image\.png)$ {
        # Only for the one extension nginx has no type for: .webmanifest.
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        try_files $uri =404;
    }

    # The entry point must never be cached, or a deploy keeps serving old JS.
    # Every SPA route arrives here through `try_files` or `index`, so this is the one place
    # a page-level header can go; $request_uri still holds the address the reader asked for.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag $keyup_x_robots always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # The embeddable pages (docs/EMBED.md): a separate, small Vite entry, framable by the
    # sites EMBED_FRAME_ANCESTORS names (`*` by default — any site). No X-Frame-Options
    # here: it cannot express "these sites", and a browser that sees both obeys the
    # stricter one. The page only reads, and its API calls and live socket are same-origin
    # with it, so framing it hands a third-party page nothing it could not fetch itself.
    location /embed/ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "frame-ancestors ${EMBED_FRAME_ANCESTORS}" always;
        try_files /embed.html =404;
    }
    location = /embed.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "frame-ancestors ${EMBED_FRAME_ANCESTORS}" always;
    }

    # SPA fallback: every unknown path renders the app, which routes client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
